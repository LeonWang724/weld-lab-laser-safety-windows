/* Gloss finish. Motion uses only transforms and opacity for the monitor. */
.laser-blob {
  border-color: rgba(255,255,255,.98);
  background:
    radial-gradient(ellipse at 14% 0%,rgba(255,255,255,.95),transparent 45%),
    linear-gradient(132deg,rgba(255,255,255,.76),rgba(255,255,255,.14) 38%,rgba(255,255,255,.36) 70%,rgba(255,255,255,.72));
  background-color: #e8eef1;
  box-shadow:
    inset 0 2px 2px #fff,
    inset 2px 0 4px rgba(255,255,255,.95),
    inset -2px 0 4px rgba(255,255,255,.72),
    inset 0 -3px 4px rgba(255,255,255,.98),
    inset 0 -16px 24px rgba(255,255,255,.65),
    0 26px 45px -28px rgba(85,100,135,.32),
    0 2px 6px rgba(110,124,150,.10);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  animation: glass-arrive 420ms cubic-bezier(.2,.8,.2,1) both;
}
.laser-blob::before {
  background:
    radial-gradient(ellipse at 90% 90%,var(--aura),transparent 68%),
    linear-gradient(171deg,rgba(255,255,255,.9),transparent 35%,rgba(255,255,255,.06) 72%,rgba(255,255,255,.85));
}
.laser-blob::after {
  border-color: rgba(255,255,255,.9);
  box-shadow: inset 0 1px 1px #fff;
  mask-image: linear-gradient(132deg,#000,rgba(0,0,0,.1) 45%,rgba(0,0,0,.15) 60%,#000);
}
.green { --aura: #a9d5c583; --ring: #9ebead65; }
.infrared { --aura: #c3a9df7a; --ring: #b6a2cd70; }
.glass-reflection::before {
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  border: 0;
  border-radius: inherit;
  background: radial-gradient(ellipse at 15% 0%,rgba(255,255,255,.28),rgba(255,255,255,.08) 52%,transparent 80%);
  transform: none;
  filter: none;
}
.glass-reflection::after {
  width: 76%;
  height: 160%;
  top: -45%;
  right: -15%;
  background: radial-gradient(ellipse,rgba(255,255,255,.24),transparent 68%);
  filter: blur(24px);
  animation: reflection-drift 12s ease-in-out infinite alternate;
}
.infrared .glass-reflection::after { animation-delay: -6s; }
.optical-art {
  border-color: var(--ring);
  background: radial-gradient(circle at 31% 24%,rgba(255,255,255,.7),rgba(255,255,255,.1) 45%,rgba(255,255,255,.3));
  box-shadow: inset 1px 1px 3px rgba(255,255,255,.85),inset -1px -1px 2px rgba(125,125,155,.07),0 0 34px var(--aura);
}
.optical-art::before { box-shadow: 0 1px 1px rgba(255,255,255,.9); }
.optical-art::after { box-shadow: inset 0 1px 1px rgba(255,255,255,.9),0 1px 1px rgba(255,255,255,.75); }
.beam::after { animation: beam-soften 7s ease-in-out infinite alternate; }
.infrared .beam::after { animation-delay: -3s; }
.wavelength strong { text-shadow: 0 2px 1px rgba(255,255,255,.95),0 -1px 1px rgba(74,88,100,.07); }
.empty-screen,.unknown-screen { animation: message-arrive 240ms ease-out; }
.icon-button,.button,.report-buttons button { transition: background 160ms ease,border-color 160ms ease,transform 160ms ease; }
.button:active,.icon-button:active,.report-buttons button:active { transform: scale(.97); }
dialog[open] { animation: glass-arrive 220ms ease-out; }
@keyframes glass-arrive {
  from { opacity: .8; transform: translateY(6px) scale(.994); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes reflection-drift {
  from { opacity: .3; transform: translateX(-18px) rotate(-35deg); }
  to { opacity: .62; transform: translateX(18px) rotate(-35deg); }
}
@keyframes beam-soften { from { opacity: .7; } to { opacity: 1; } }
@keyframes message-arrive { from { opacity: .7; } to { opacity: 1; } }
/* User-provided character photos sit below the glass highlights. */
.character-art {
  display: contents;
}
.character-art img {
  position: absolute;
  z-index: -1;
  pointer-events: none;
  mix-blend-mode: multiply;
  right: 17px;
  bottom: 0;
  height: 98%;
  width: auto;
  max-width: 68%;
  object-fit: contain;
  object-position: right bottom;
  opacity: .82;
  mask-image: linear-gradient(180deg,#000 87%,transparent 100%);
}
.infrared .character-art img {
  right: -6%;
  height: 108%;
  max-width: 77%;
  opacity: .53;
  mask-image: linear-gradient(90deg,transparent 0%,#000 25%,#000 88%,transparent 100%);
}
.laser-blob .glass-reflection { z-index: 0; }
.laser-blob .blob-content { z-index: 1; }
.wavelength { position: relative; }
.wavelength::before {
  content: '';
  position: absolute;
  inset: -14px -18px -14px -20px;
  z-index: -1;
  background: radial-gradient(ellipse at 30% 45%,rgba(246,249,249,.9),rgba(246,249,249,.45) 50%,transparent 74%);
  filter: blur(10px);
  pointer-events: none;
}
@media(max-width:720px) {
  .character-art img { right: 13px; height: 98%; }
  .infrared .character-art img { right: -9%; height: 106%; max-width: 78%; }
}
/* Character mode changes appearance only, never laser reports. */
.star-wars-off .character-art { display: none; }
.star-wars-switch {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 36px;
  padding: 7px 12px;
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 30px;
  background: rgba(255,255,255,.48);
  box-shadow: inset 0 1px 1px #fff,0 2px 8px rgba(70,75,100,.04);
  color: #68687f;
  font-size: 10px;
  letter-spacing: .15px;
  white-space: nowrap;
}
.switch-track {
  width: 29px;
  height: 17px;
  border-radius: 20px;
  background: #aeb3c0;
  position: relative;
  box-shadow: inset 0 1px 2px rgba(55,55,80,.16);
  transition: background 180ms ease;
}
.switch-thumb {
  position: absolute;
  left: 2px;
  top: 2px;
  width: 13px;
  height: 13px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(30,30,50,.2);
  transition: transform 180ms ease;
}
.star-wars-switch[aria-checked=true] .switch-track { background: #8d84b2; }
.star-wars-switch[aria-checked=true] .switch-thumb { transform: translateX(12px); }
.tool-buttons { opacity: .82; align-items: center; }
@media(max-width:420px) {
  .display-tools { left: 18px; right: 12px; }
  .preview-label { max-width: 72px; font-size: 8px; line-height: 1.5; }
  .star-wars-switch { padding: 7px 10px; gap: 7px; }
  .tool-buttons { gap: 2px; }
}

.channel-tools { display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:10px;color:#88869a;margin:18px 0 2px; }
.channel-tools span:first-child { color:#655d80;font-weight:600; }
.add-wavelength-form { padding:18px 0 5px; }
.add-wavelength-form label { display:block;font-size:11px;color:#6f6b82;margin-bottom:10px; }
.add-wavelength-form>div { display:flex;align-items:center;gap:10px; }
.add-wavelength-form input { flex:1;width:100px;min-width:0;border:1px solid #fff;background:#ffffff90;border-radius:12px;padding:12px;color:#38364b;font:inherit;font-size:13px;outline-offset:3px; }
.add-wavelength-form>div>span { color:#9691a5;font-size:11px; }
.remove-wavelength { min-width:32px;padding:8px!important;font-size:16px!important;color:#93859c!important;background:transparent!important;border-color:transparent!important; }
.custom-channel { --aura:#bdd6e980;--ring:#a8c4d5; }
.laser-blob.long-wavelength .wavelength strong { font-size:clamp(62px,6.5vw,100px);letter-spacing:-4px; }
.laser-blob.very-long-wavelength .wavelength strong { font-size:clamp(38px,4.5vw,70px);letter-spacing:-2px; }
.laser-grid.multi { gap:20px;max-width:1080px; }
.laser-grid.multi .laser-blob { min-height:240px;aspect-ratio:1.85;border-radius:38px; }
.laser-grid.multi .laser-blob::after { border-radius:33px; }
.laser-grid.multi .blob-content { padding:30px; }
.laser-grid.multi .wavelength strong { font-size:clamp(62px,7.8vw,100px); }
.laser-grid.multi .long-wavelength .wavelength strong { font-size:clamp(48px,5.8vw,78px); }
.laser-grid.multi .very-long-wavelength .wavelength strong { font-size:clamp(34px,4vw,58px); }
.laser-grid.multi .on-label { margin-top:16px; }
.laser-grid.multi>.laser-blob:last-child:nth-child(odd) { grid-column:1/-1;width:calc(50% - 10px);justify-self:center; }
.display-surface.multi-active { padding-top:50px;padding-bottom:70px; }
@media(max-width:720px) {
  .laser-grid.multi { max-width:420px; }
  .laser-grid.multi .laser-blob { min-height:210px;aspect-ratio:1.85; }
  .laser-grid.multi>.laser-blob:last-child:nth-child(odd) { grid-column:auto;width:100%; }
  .channel-tools { font-size:9px; }
}
/* The space effect is independent of character mode. */
.space-background { position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;background:#000; }
.display-surface { z-index:1; }
body.space-on { background:#000; }
.space-on .ambient { display:none; }
.space-on .empty-screen { color:#ececf0; }
.space-on .unknown-screen,.space-on .unknown-detail { color:#e7d4ad; }
.space-on .display-tools .preview-label { color:#b1b1bb; }
.space-on .display-tools .icon-button { color:#dedee7; }
.space-on .display-tools .icon-button:hover { background:#ffffff20;border-color:#ffffff50; }

const MAX_ACTIVE = 4;
const REPORT_TTL = 5 * 60 * 1000;
const LINK_TTL = 3500;
const emptyReports = (wavelengths = WAVELENGTHS) => Object.fromEntries(wavelengths.map(nm => [nm, { state: 'unknown', reportedAt: 0 }]));

function validCharacterAssignments(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value) && Object.entries(value).every(([nm, character]) =>
    String(Number(nm)) === nm && Number.isFinite(Number(nm)) && Number(nm) > 0 && Number(nm) <= 1e9 && Object.hasOwn(CHARACTERS, character));

function themeForWavelength(nm, wavelengths = WAVELENGTHS, assignments = {}) {
  if (Object.hasOwn(assignments, nm) && Object.hasOwn(CHARACTERS, assignments[nm])) return assignments[nm];

  if (nm === 1064) return 'infrared';
  const position = wavelengths.filter(value => !WAVELENGTHS.includes(value)).indexOf(nm);
  return position === 0 ? 'palpatine' : position === 1 ? 'chewbacca' : 'custom-channel';
}

function normalizeWavelength(value) {
  const nm = Number(value);
  if (!Number.isFinite(nm) || nm <= 0 || nm > 1e9) throw new Error('Enter a positive wavelength in nanometers.');
  return nm;
}

function validCatalog(values) {
  return Array.isArray(values) && values.length >= 2 && values.every(nm => typeof nm === 'number' && Number.isFinite(nm) && nm > 0 && nm <= 1e9) && new Set(values).size === values.length && WAVELENGTHS.every(nm => values.includes(nm));
}

  if (!wavelengths.includes(nm)) return false;
  return effectiveStatus(reports[nm], mode, linkAt, now) === 'on' || wavelengths.filter(value => effectiveStatus(reports[value], mode, linkAt, now) === 'on').length < MAX_ACTIVE;
}

function effectiveStatus(report, mode, linkAt, now = Date.now()) {
  if (!report || !['on', 'off'].includes(report.state)) return 'unknown';
  if (!Number.isFinite(report.reportedAt) || now < report.reportedAt || now - report.reportedAt > REPORT_TTL) return 'unknown';
  if (mode === 'usb' && (!linkAt || now < linkAt || now - linkAt > LINK_TTL)) return 'unknown';
  return report.state;
}

function parseBoardFrame(line, now = Date.now()) {

    reports[laser.nm] = { state: laser.state === -1 ? 'unknown' : laser.state === 1 ? 'on' : 'off', reportedAt: now - age };

  return reports;
}

function summaryFor(states) {
  const on = states.filter(s => s === 'on').length;
  const unknown = states.filter(s => s === 'unknown').length;
  if (on) return { on, unknown, title: `${on} laser${on === 1 ? '' : 's'} reported on`, description: unknown ? `${unknown} channel unknown. Follow the lab’s entry procedure before entering.` : 'Follow the lab’s entry procedure before entering.' };
  if (unknown) return { on, unknown, title: 'Laser status unknown', description: 'Treat lasers as potentially on. Verify with the lab operator.' };

}
function applyServerState(data) {
  if (!data || data.v !== 1 || typeof data.instance !== 'string' || !Number.isSafeInteger(data.revision) || !validCatalog(data.wavelengths) || typeof data.starWarsEnabled !== 'boolean' || typeof data.spaceEnabled !== 'boolean' || !data.reports || !data.characters) throw new Error('The display computer sent an invalid status.');
  const choices = Object.fromEntries(Object.entries(data.characters).map(([nm,value]) => [Number(nm),value]));
  const incoming = Object.fromEntries(Object.entries(data.reports).map(([nm,value]) => [Number(nm),value]));
  if (!validCharacterAssignments(choices) || !data.wavelengths.every(nm => incoming[nm] && ['on','off','unknown'].includes(incoming[nm].state) && Number.isFinite(incoming[nm].ageMs) && incoming[nm].ageMs >= 0)) throw new Error('The display computer sent an invalid status.');
  if (data.instance === serverInstance && data.revision < serverRevision) return;
  const changed = JSON.stringify(wavelengths) !== JSON.stringify(data.wavelengths), now = Date.now();
  serverInstance = data.instance; serverRevision = data.revision; networkUpdatedAt = now; networkError = '';
  wavelengths = data.wavelengths; characterAssignments = choices;
  reports = Object.fromEntries(wavelengths.map(nm => [nm,{state:incoming[nm].state,reportedAt:now-incoming[nm].ageMs}]));
  if (starWarsEnabled !== data.starWarsEnabled) setStarWarsMode(data.starWarsEnabled,false);
  if (spaceEnabled !== data.spaceEnabled) setSpaceBackground(data.spaceEnabled,false);
  if (changed) renderReportControls();
  render();
}
async function apiRequest(path, data) {
  const controller = new AbortController(), timeout = setTimeout(() => controller.abort(),2500);
  try {
    const response = await fetch(path,{method:data ? 'POST' : 'GET',cache:'no-store',signal:controller.signal,...(data ? {headers:{'Content-Type':'application/json'},body:JSON.stringify(data)} : {})});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'The display computer could not accept that change.');
    return result;
  } finally { clearTimeout(timeout); }
}
async function networkCommand(path,data) {
  try { const result = await apiRequest(path,data); applyServerState(result); setText('controls-message',''); }
  catch (error) { if (error.name === 'AbortError' || error instanceof TypeError) throw new Error('Could not reach the display computer. Check the lab network.'); throw error; }
}
async function pollServer() {
  try { applyServerState(await apiRequest('/api/state')); }
  catch { networkError = 'Connection lost · laser status is unknown.'; render(); }
  finally { setTimeout(pollServer,1000); }
}
async function requestReport(nm,state) {
  try {
    if (!canEdit()) throw new Error('Connect to the display computer before reporting.');
    if (!wavelengths.includes(nm)) throw new Error('Add that wavelength in Settings first.');
    if (state === 'on' && !canReportOn(nm,reports,'manual',0,wavelengths)) throw new Error('Maximum four lasers on. Turn one off before switching another on.');
    if (networkMode) await networkCommand('/api/report',{nm,state});
    else { reports[nm] = {state,reportedAt:Date.now()}; render(); broadcast(); }
    showToast(`${nm} nm ${state.toUpperCase()}`);
  } catch (error) { showError(error); }
}

$('star-wars-toggle').addEventListener('click',() => setStarWarsMode(!starWarsEnabled));
$('settings-star-wars').addEventListener('click',() => setStarWarsMode(!starWarsEnabled));
$('settings-space').addEventListener('click',() => setSpaceBackground(!spaceEnabled));
$('open-settings').addEventListener('click',() => $('settings-dialog').showModal());
$('pi-connection').hidden = !desktopApp;
$('pi-address').value = networkMode ? location.origin : window.weldNative?.piAddress || window.weldDesktop?.piAddress || '';
$('connect-pi').addEventListener('click',() => nativeMessage({action:'connectPi',address:$('pi-address').value.trim()}));
$('pi-address').addEventListener('keydown',event => { if (event.key === 'Enter') { event.preventDefault(); $('connect-pi').click(); } });
window.addEventListener('storage',event => {
  if (networkMode) return;
  if (event.key === themeStorageKey) setStarWarsMode(event.newValue !== 'off',false);
  if (event.key === spaceStorageKey) setSpaceBackground(event.newValue === 'on',false);
  if (event.key === charactersStorageKey) { try { setCharacterAssignments(JSON.parse(event.newValue) ?? {},false); } catch {} }
});
window.addEventListener('weld-star-wars-mode',event => { if (!networkMode) setStarWarsMode(event.detail,false); });
window.addEventListener('weld-space-background',event => { if (!networkMode) setSpaceBackground(event.detail,false); });
window.addEventListener('weld-characters',event => { if (!networkMode) setCharacterAssignments(event.detail,false); });
$('report-controls').addEventListener('change',event => {
  const select = event.target.closest('select[data-character]');
  if (!select || !Object.hasOwn(CHARACTERS,select.value)) return;
  if (networkMode) networkCommand('/api/character',{nm:Number(select.dataset.character),character:select.value}).catch(showError);
  else setCharacterAssignments({...characterAssignments,[select.dataset.character]:select.value});
});
$('report-controls').addEventListener('click',async event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  if (button.dataset.nm) { requestReport(Number(button.dataset.nm),button.dataset.state); return; }
  if (button.dataset.remove) {
    const nm = Number(button.dataset.remove);
    try {
      if (networkMode) await networkCommand('/api/wavelengths',{action:'remove',nm});
      else {
        if (reports[nm]?.state === 'on' || DEFAULT_WAVELENGTHS.includes(nm)) return;
        wavelengths = wavelengths.filter(value => value !== nm); delete reports[nm];
        const choices = {...characterAssignments}; delete choices[nm]; setCharacterAssignments(choices);
        persistCatalog(); renderReportControls(); render(); broadcast();
      }
    } catch (error) { showError(error); }
  }
});
$('add-wavelength-form').addEventListener('submit',async event => {
  event.preventDefault();
  try {
    const nm = normalizeWavelength($('new-wavelength').value);
    if (networkMode) await networkCommand('/api/wavelengths',{action:'add',nm});
    else {
      if (wavelengths.includes(nm)) throw new Error('That wavelength is already in your list.');
      wavelengths.push(nm); reports[nm] = {state:'unknown',reportedAt:0};
      persistCatalog(); renderReportControls(); render(); broadcast();
    }
    $('new-wavelength').value = ''; setText('controls-message',`${nm} nm added.`);
  } catch (error) { showError(error); }
});
$('reset-reports').addEventListener('click',async () => {
  try {
    if (networkMode) await networkCommand('/api/reset',{});
    else { reports = emptyReports(wavelengths); render(); broadcast(); }
  } catch (error) { showError(error); }
});
document.querySelectorAll('.close-dialog').forEach(button => button.addEventListener('click',() => button.closest('dialog').close()));
$('settings-dialog').addEventListener('click',event => {
  if (event.target === $('settings-dialog')) { const r = event.target.getBoundingClientRect(); if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) event.target.close(); }
});
$('open-display').addEventListener('click',() => {
  if (desktopApp) { nativeMessage({action:'monitorWindow'}); return; }
  const target = new URL(location.href); target.searchParams.delete('control'); target.searchParams.set('display','1');
  if (!window.open(target,'_blank')) showToast('Allow pop-ups to open the monitor view.');
});
$('fullscreen').addEventListener('click',async () => {
  $('settings-dialog').close();
  if (desktopApp) { nativeMessage({action:'fullscreen'}); return; }
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); await requestWakeLock(); }
  catch { showToast('Use your browser’s full-screen option.'); }
});
async function requestWakeLock() {
  if (!('wakeLock' in navigator) || document.hidden) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
channel?.addEventListener('message',({data}) => {
  if (!data || data.sender === sourceId) return;
  if (data.type === 'hello') { broadcast(); return; }
  if (data.type === 'snapshot' && validCatalog(data.wavelengths) && data.reports && data.wavelengths.every(nm => data.reports[nm] && ['on','off','unknown'].includes(data.reports[nm].state) && Number.isFinite(data.reports[nm].reportedAt)) && data.wavelengths.filter(nm => effectiveStatus(data.reports[nm],'manual',0) === 'on').length <= MAX_ACTIVE) {
    wavelengths = data.wavelengths; reports = data.reports; persistCatalog(); renderReportControls(); render();
  }
});
let keyboardBuffer = '', lastKeyAt = 0;
document.addEventListener('keydown',event => {
  if (document.querySelector('dialog[open]') || event.ctrlKey || event.metaKey || event.altKey || event.repeat || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
  const now = Date.now();
  if (/^[0-9.]$/.test(event.key)) { if (now-lastKeyAt > 2000) keyboardBuffer = ''; keyboardBuffer = (keyboardBuffer+event.key).slice(-24); lastKeyAt = now; }
  else if (event.key === 'Enter') { const nm = Number(keyboardBuffer); keyboardBuffer = ''; if (now-lastKeyAt <= 2000 && wavelengths.includes(nm)) { event.preventDefault(); requestReport(nm,statesNow()[wavelengths.indexOf(nm)] === 'on' ? 'off' : 'on'); } }
  else keyboardBuffer = '';
});
document.addEventListener('visibilitychange',() => { render(); if (!document.hidden && new URLSearchParams(location.search).has('display')) requestWakeLock(); });
setStarWarsMode(starWarsEnabled,false); setSpaceBackground(spaceEnabled,false); renderReportControls(); render();
if (networkMode) pollServer(); else send({type:'hello'});
if (new URLSearchParams(location.search).has('display')) requestWakeLock();
if (new URLSearchParams(location.search).has('control')) $('settings-dialog').showModal();
setInterval(render,1000);

</script>
</body>
