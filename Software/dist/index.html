<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e7eaf1">
  <meta name="description" content="Weld Lab Laser Safety — a clear display of manually reported laboratory laser activity.">
  <title>Weld Lab Laser Safety</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="space-background" class="space-background" aria-hidden="true" hidden></canvas>
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="display-surface">
    <section id="laser-grid" class="laser-grid" aria-label="Laser status" aria-live="polite"></section>
    <p class="empty-screen" id="empty-screen" hidden>SAFE</p>
    <p class="unknown-screen" id="unknown-screen" hidden>AWAITING REPORTS</p>
    <p class="unknown-detail" id="unknown-detail" hidden></p>
  </main>
  <div class="display-tools"><div class="tool-buttons">
    <button class="star-wars-switch" id="star-wars-toggle" type="button" role="switch" aria-checked="true" aria-label="Star Wars mode" title="Turn character backgrounds on or off"><span>Star Wars</span><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button>
    <button class="settings-button" id="open-settings" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2v3l3 2 1 3h6l1-3 3-2v-3l2-2-2-3-3-1-1-3Z"/><circle cx="12" cy="11.5" r="3"/></svg><span>Settings</span></button>
  </div></div>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-top"><h2 id="settings-title">Settings</h2><button class="icon-button close-dialog" aria-label="Close settings">✕</button></div>
    <section class="pi-connection" id="pi-connection" hidden><label for="pi-address">Display computer address</label><div><input id="pi-address" type="text" placeholder="DISPLAY-PC:8765" autocomplete="off" spellcheck="false"><button class="button glass-button" id="connect-pi" type="button">Connect</button></div></section>
    <p class="settings-hint connection-status" id="connection-status"></p>
    <section class="settings-section" aria-label="Appearance">
      <div class="appearance-setting"><strong id="characters-label">Star Wars mode</strong><button id="settings-star-wars" class="appearance-switch" type="button" role="switch" aria-checked="true" aria-labelledby="characters-label"><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button></div>
      <div class="appearance-setting"><strong id="space-label">Space background</strong><button id="settings-space" class="appearance-switch" type="button" role="switch" aria-checked="false" aria-labelledby="space-label"><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button></div>
    </section>
    <section class="settings-section laser-settings" aria-labelledby="lasers-title">
      <div class="settings-section-heading"><h3 id="lasers-title">Lasers</h3><span id="active-limit-count">0 / 4 lasers on</span></div>
      <p class="settings-hint">Report status only. These controls do not operate lasers.</p>
      <div id="report-controls"></div>
      <form class="add-wavelength-form" id="add-wavelength-form"><label for="new-wavelength">Add wavelength</label><div><input id="new-wavelength" name="wavelength" type="number" min="0.000001" max="1000000000" step="any" placeholder="Wavelength" aria-label="New wavelength in nanometers" required><span>nm</span><button class="button glass-button" id="add-wavelength" type="submit">Add</button></div></form>
      <p class="settings-hint">Type a saved wavelength and press Enter to toggle it. Reports last 5 minutes.</p>
      <p class="message" role="status" id="controls-message"></p>
    </section>
    <details class="advanced-settings"><summary>More options</summary>
      <div class="advanced-actions"><button class="text-button" id="fullscreen" type="button">Full screen</button><button class="text-button" id="open-display" type="button">Open monitor view</button><button class="text-button" id="reset-reports" type="button">Reset to unknown</button></div>
    </details>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
